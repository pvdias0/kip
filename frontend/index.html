<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIP - Organizador Financeiro Pessoal e Controle de Gastos</title>
    <meta name="description" content="Organize suas finanças com o KIP: registre receitas e despesas, crie categorias, acompanhe cartões e dívidas e veja relatórios do seu dinheiro em tempo real. Grátis." />
    <meta name="author" content="KIP" />
    <link rel="canonical" href="https://kip.pvapps.com.br/" />
    <meta name="theme-color" content="#128174" />

    <!-- Favicon - Updated 2026-02-03 -->
    <link rel="icon" type="image/svg+xml" href="/kip-icon.svg?v=2" />
    <link rel="apple-touch-icon" href="/kip-icon.svg?v=2" />

    <!-- Antes da primeira pintura: aplica o tema salvo e esconde a landing
         pre-renderizada se houver sessao (o React mostra o app em seguida).
         O hash deste script e liberado na CSP pelo backend (utils/spa.js). -->
    <script data-inline-boot>try{var d=document.documentElement;if(localStorage.getItem("kip-theme")==="dark"){d.classList.add("dark");d.style.colorScheme="dark"}if(localStorage.getItem("auth_token"))d.classList.add("has-session")}catch(e){}</script>
    <style>html.has-session [data-app-shell]{display:none}</style>

    <!-- Imagem LCP do hero: descoberta já no HTML, só a do breakpoint atual -->
    <link rel="preload" as="image" type="image/webp" href="/hero/lp-mobile.webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/hero/lp-tablet.webp" media="(min-width: 768px) and (max-width: 1023px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/hero/lp-desktop.webp" media="(min-width: 1024px)" fetchpriority="high" />

    <!-- Open Graph -->
    <meta property="og:title" content="KIP - Organizador Financeiro Pessoal" />
    <meta property="og:description" content="Registre receitas e despesas, organize categorias e acompanhe sua saúde financeira com relatórios em tempo real." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kip.pvapps.com.br/" />
    <meta property="og:site_name" content="KIP" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://kip.pvapps.com.br/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->

    <meta name="twitter:image" content="https://kip.pvapps.com.br/og-image.jpg" />
    <meta name="google-site-verification" content="_NoEXz3Rled6D8EThQRj_tbWfSFuwadYzsAs0diUdnI" />
